[package]
name = "mg-plan"
version = "0.1.0"
edition = "2021"
description = "Commitment, criteria, evidence, and verification kernel for mg-plan"
license = "MIT"

[lib]
path = "src/lib.rs"

[dependencies]
dirs = "5"
# the suite's SQLite version
rusqlite = "0.32"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
